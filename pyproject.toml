[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geegees"
version = "0.1.0"
description = "A simple Python project"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Tim", email = "tim@example.com"}
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[tool.setuptools]
packages = ["geegees"]

[tool.setuptools.package-dir]
"" = "src"
